<!DOCTYPE html>
<html>
<head>
    <title>Redefinir Senha - Croesus</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin-top: 5px; }
        button { background: #2563eb; color: white; border: none; padding: 10px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Redefinir Senha</h2>
    <form id="resetForm">
        <div class="form-group">
            <label>Nova Senha:</label>
            <input type="password" id="newPassword" required>
        </div>
        <div class="form-group">
            <label>Confirmar Senha:</label>
            <input type="password" id="confirmPassword" required>
        </div>
        <button type="submit">Salvar Nova Senha</button>
    </form>
    <p id="message"></p>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                document.getElementById('message').textContent = 'As senhas não coincidem';
                return;
            }

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                
                const data = await response.json();
                document.getElementById('message').textContent = 
                    response.ok ? 'Senha alterada com sucesso!' : data.message;
            } catch (error) {
                document.getElementById('message').textContent = 'Erro ao conectar ao servidor';
            }
        });
    </script>
</body>
</html>
